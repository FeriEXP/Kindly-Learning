<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KINDLY LEARNING</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-192.png" />
  <meta name="theme-color" content="#d92b3a" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; }
    header { background: linear-gradient(135deg, #d92b3a, #991b1b); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.5px; }
    .status { font-size: 12px; color: #bbf7d0; margin-top: 2px; }
    .badge { background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .container { max-width: 520px; margin: 28px auto; padding: 0 16px; }
    .upload-box {
      display: block;
      background: #1e293b;
      border: 2px dashed #475569;
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
    }
    .upload-box:active { border-color: #38bdf8; background: #162038; }
    .upload-box h2 { margin: 0 0 8px; font-size: 18px; }
    .upload-box p { margin: 0; font-size: 13px; color: #94a3b8; line-height: 1.5; }
    input[type="file"] { display: none; }
    #log { margin-top: 16px; font-size: 14px; text-align: center; font-weight: 600; color: #38bdf8; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/icon-192.png" alt="Avatar" />
      <div>
        <h1>KINDLY LEARNING</h1>
        <div class="status" id="dbStatus">● Menghubungkan MongoDB...</div>
      </div>
    </div>
    <div class="badge" id="totalBadge">0 Soal</div>
  </header>

  <div class="container">
    <label class="upload-box" for="excelFile">
      <h2>Pilih File Kisi-Kisi</h2>
      <p>Format Excel (.xlsx, .xls) atau CSV.<br/>Tanpa perlu judul kolom — pilih file langsung otomatis tersimpan ke database.</p>
      <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" onchange="autoUpload(event)" />
    </label>
    <div id="log"></div>
  </div>

  <script>
    async function loadCount() {
      try {
        const res = await fetch('/api/index');
        const json = await res.json();
        if (json.ok) {
          document.getElementById('dbStatus').textContent = '● MongoDB Terhubung';
          document.getElementById('totalBadge').textContent = json.data.length + ' Soal';
        }
      } catch (e) {
        document.getElementById('dbStatus').textContent = '● Gagal terhubung DB';
      }
    }

    function autoUpload(e) {
      const file = e.target.files[0];
      const log = document.getElementById('log');
      if (!file) return;

      const namaModul = file.name.replace(/\.[^/.]+$/, "");
      log.style.color = '#38bdf8';
      log.textContent = 'Membaca & mengunggah otomatis...';

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const wb = XLSX.read(evt.target.result, { type: 'binary' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          // header: 1 membaca semua baris sebagai array murni tanpa butuh nama kolom
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

          const items = [];
          for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].map(c => String(c ?? '').trim()).filter(Boolean);
            if (cols.length < 2) continue;

            // Lewati baris pertama jika kebetulan berisi kata "soal" & "jawaban"
            if (i === 0 && /soal|pertanyaan/i.test(cols[0]) && /jawaban|kunci/i.test(cols[1])) continue;

            if (cols.length >= 3) {
              items.push({ modul: cols[0], soal: cols[1], jawaban: cols[2] });
            } else {
              items.push({ modul: namaModul, soal: cols[0], jawaban: cols[1] });
            }
          }

          if (items.length === 0) {
            log.style.color = '#f87171';
            log.textContent = 'File kosong atau minimal harus ada 2 kolom (Soal & Jawaban).';
            return;
          }

          const res = await fetch('/api/index', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items })
          });
          const json = await res.json();

          if (json.ok) {
            log.style.color = '#4ade80';
            log.textContent = `✓ Tersimpan ${json.inserted} soal (${namaModul}) ke database!`;
            loadCount();
          } else {
            log.style.color = '#f87171';
            log.textContent = 'Gagal menyimpan ke MongoDB.';
          }
        } catch (err) {
          log.style.color = '#f87171';
          log.textContent = 'Error: ' + err.message;
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsBinaryString(file);
    }

    loadCount();
  </script>
</body>
</html>
